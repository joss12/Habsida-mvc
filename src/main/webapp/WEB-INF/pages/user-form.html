<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        .input-error {
            border-color: #dc2626;
        }

        .field-error {
            display: block;
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
        }

        .global-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .global-error p {
            margin: 0;
        }

        .buttons {
            margin-top: 24px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #111;
        }

        .cancel {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #e5e7eb;
            color: #222;
        }

        .cancel:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${user.id == null ? 'Add User' : 'Edit User'}">
        User Form
    </h1>

    <form th:action="@{/users/save}"
          th:object="${user}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="global-error"
             th:if="${#fields.hasGlobalErrors()}">

            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}">
            </p>

        </div>

        <div class="field">
            <label for="firstName">First Name</label>

            <input id="firstName"
                   type="text"
                   th:field="*{firstName}"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'input-error'">

            <span class="field-error"
                  th:if="${#fields.hasErrors('firstName')}"
                  th:errors="*{firstName}">
            </span>
        </div>

        <div class="field">
            <label for="lastName">Last Name</label>

            <input id="lastName"
                   type="text"
                   th:field="*{lastName}"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'input-error'">

            <span class="field-error"
                  th:if="${#fields.hasErrors('lastName')}"
                  th:errors="*{lastName}">
            </span>
        </div>

        <div class="field">
            <label for="email">Email</label>

            <input id="email"
                   type="email"
                   th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'input-error'">

            <span class="field-error"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}">
            </span>
        </div>

        <div class="buttons">

            <button type="submit">
                Save
            </button>

            <a class="cancel"
               th:href="@{/users}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
        }

        .add-button {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e5e5;
        }

        th {
            background: #fafafa;
        }

        .actions a {
            text-decoration: none;
            margin-right: 10px;
        }

        .edit {
            color: #2563eb;
        }

        .delete-button {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            padding: 0;
            font: inherit;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Users</h1>

        <a class="add-button"
           href="/users/new"
           th:href="@{/users/new}">
            + Add User
        </a>
    </div>

    <div th:if="${errorMessage}"
         class="error-message"
         th:text="${errorMessage}">
    </div>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.firstName}"></td>
            <td th:text="${user.lastName}"></td>
            <td th:text="${user.email}"></td>

            <td class="actions">
                <a class="edit"
                   th:href="@{/users/edit/{id}(id=${user.id})}">
                    Edit
                </a>

                <form th:action="@{/users/delete/{id}(id=${user.id})}"
                      method="post"
                      style="display: inline;">

                    <button type="submit"
                            class="delete-button">
                        Delete
                    </button>

                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="5" class="empty">
                No users found.
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
